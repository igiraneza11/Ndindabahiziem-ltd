name: Keep Render backend awake

on:
  schedule:
    # Every 5 minutes — prevents free-tier cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 20 \
            "https://ndindabahiziem-backend.onrender.com/api/health" \
            || echo "Ping failed (service may be deploying)"
