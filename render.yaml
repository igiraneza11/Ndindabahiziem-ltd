services:
  - type: web
    name: ndindabahiziem-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_NAME
        value: Ndindabahiziem Ltd
      - key: COMPANY_PHONE
        value: "+250 782 177 952"
      - key: COMPANY_WEBSITE
        value: https://www.ndindabahiziem.com
